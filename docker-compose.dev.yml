services:
  waytrace:
    build: .
    # Loopback only, like docker-compose.yml: on a LAN, 0.0.0.0 would open
    # the scan endpoint to every machine on it.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - waytrace-data:/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    env_file:
      - path: .env
        required: false
    environment:
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=/data/waytrace.db
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  waytrace-data:

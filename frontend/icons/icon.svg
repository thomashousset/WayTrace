<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 24 72 66">
  <!-- No background. The rounded square this mark used to sit on was there for
       the favicon's sake, and it cost twice: it boxed the W in at every size,
       and it forced the mark to stay small inside its padding. The viewBox now
       crops to the ink, so at 16 px the W is the whole icon.

       What the square also did was guarantee contrast. The light stroke is the
       interface's near-white, which lands on near-white in a light browser tab
       and leaves an orange tick where the logo should be. An SVG can carry its
       own style sheet and the browser painting the tab evaluates it, so the
       stroke flips to the dark tone when the tab is light. The accent stroke
       needs nothing: it reads on both.

       The PNG and .ico variants keep their square on purpose. They are the
       fallback where SVG favicons are not painted, and apple-touch-icon and
       the maskable icons are required to be opaque by their platforms. -->
  <style>
    .way { stroke: #FFFDF6; }
    @media (prefers-color-scheme: light) { .way { stroke: #1C1B18; } }
  </style>
  <path d="M 22 32 L 38 70 L 50 50 L 62 70 L 78 32" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22 32 L 38 70 L 50 50" fill="none" class="way" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 50 L 62 70 L 78 32" fill="none" stroke="#E87A48" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="34" cy="84" r="2" fill="#E87A48" fill-opacity=".4"/>
  <circle cx="50" cy="84" r="2.4" fill="#E87A48" fill-opacity=".66"/>
  <circle cx="66" cy="84" r="2.8" fill="#E87A48"/>
</svg>
